function migrateSave(data, fromSchema){
  var schemaVersion = fromSchema || data.schema || 2;   // saves predating the marker are schema 2
  var done = data.done || {}, stars = data.stars || {};
  while(schemaVersion < SCHEMA){
    var idMap = MAPS[schemaVersion] || {}, remappedDone = {}, remappedStars = {};
    Object.keys(done).forEach(function(id){ remappedDone[idMap[id]||id] = done[id]; });
    Object.keys(stars).forEach(function(id){ remappedStars[idMap[id]||id] = stars[id]; });
    done = remappedDone; stars = remappedStars; schemaVersion++;
  }
  return { schema:SCHEMA, player:sanitizeName(data.player), xp:toXp(data.xp), done:done, stars:stars };
}

/* Who is playing.
   Stored with the progress, so it travels with progress.json and with an
   exported file. Kept in localStorage rather than a session cookie or
   sessionStorage: those are cleared when the tab closes, which would throw away
   the progress too. Nothing is sent anywhere — it never leaves the browser. */
function sanitizeName(raw){
  return String(raw||'')
    .replace(/[^\p{L}\p{N} '\-]/gu,'')   // no quotes or backslashes: the name is
    .replace(/\s+/g,' ')                   // pasted into a JS string in one stage
    .trim()
    .slice(0,24);
}
// XP arrives from three places that are not all trustworthy: localStorage, a
// progress file someone hands you, and the server's copy. Anything that is not
// a sane number becomes 0 here, at the boundary, so nothing downstream has to
// wonder — a string would otherwise concatenate instead of add, and would reach
// innerHTML as markup.
function toXp(value){
  var n=Number(value);
  return (isFinite(n) && n>0) ? Math.floor(n) : 0;
}
function playerName(){ return (state && state.player) || 'you'; }

// Any content string may contain {{name}}.
function tpl(value){
  return typeof value==='string' ? value.replace(/\{\{name\}\}/g, playerName()) : value;
}

var state={schema:SCHEMA,player:'',xp:0,stars:{},done:{}};
try{
  var savedJson=localStorage.getItem(KEY);
  if(savedJson){
    state=migrateSave(JSON.parse(savedJson));
    localStorage.setItem(KEY,JSON.stringify(state));
  }else{
    var legacySavedJson=localStorage.getItem('loopline.v1');
    if(legacySavedJson){
      state=migrateSave(JSON.parse(legacySavedJson), 1);
      localStorage.setItem(KEY,JSON.stringify(state));
    }
  }
}catch(error){}

/* Where progress lives.
   Served by server.py, the real store is progress.json on disk and the browser
   copy is only a mirror. Opened as a file:// page there is no server to write to,
   so browser storage is all there is. The page works either way and says which. */
var fileStore=false, pushTimer=null;

function save(){
  // Test mode lets you jump to any stage and play it — including stages
  // that are not really yours to finish. state.done/.stars/.xp still update
  // in memory so the UI (ticks, stars, progress count) behaves normally
  // for that session, but none of it should land in localStorage or the
  // real player's file. Turning test mode off, or reloading, drops it —
  // whatever was last genuinely saved is all that is ever on disk.
  if(devMode) return;
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(error){}
  pushToFile();
}

// A-z0-9 slug of the current player's name — the same shape the server uses
// to name their file, so the two sides always agree on which file is theirs.
function playerSlug(){
  return (state.player||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

// Every player gets their own file on the server — progress-<name>.json — so
// two people playing on the same machine never share a save or clobber
// each other's. No name yet (or no server at all) just omits the query
// param, which the server treats as the original single-file behaviour.
function progressUrl(){
  var slug=playerSlug();
  return 'progress'+(slug?('?player='+encodeURIComponent(slug)):'');
}

function pushToFile(){
  if(!fileStore || devMode) return;
  // Snapshot the payload now, not when the debounce timer fires. State can
  // change in that 250ms gap (e.g. test mode turns on and plays something),
  // and a timer that re-reads live `state` at fire time would ship whatever
  // it finds then, including changes that have nothing to do with this save.
  var body=serializeProgress();
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    fetch(progressUrl(),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:body
    }).then(function(response){
      if(!response.ok) throw new Error('status '+response.status);
      setStoreLabel(true);
    }).catch(function(){
      // the server went away mid-session; keep playing, stop pretending it is saved
      fileStore=false;
      setStoreLabel(false,'The server stopped responding — progress is going to browser storage only now.');
    });
  },250);
}

// Is there plausibly a server.py behind this page? Static hosts have none, and
// probing for one just puts a 404 in a visitor's console.
function serverPossible(){
  if(/[?&]store=file\b/.test(location.search)) return true;   // LAN or custom host
  return /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
}

function setStoreLabel(succeeded,warning){
  var labelEl=document.getElementById('storeLabel');
  if(!labelEl) return;
  if(devMode){
    labelEl.innerHTML='Test mode — nothing you do here is being saved.';
    return;
  }
  if(fileStore){
    labelEl.innerHTML='Saving to <code>progress-'+esc(playerSlug()||'you')+'.json</code> beside the game.';
  }else if(serverPossible()){
    labelEl.innerHTML='Saving in this browser only. Run <code>python3 server.py</code> to keep progress in a file instead.';
  }else{
    labelEl.innerHTML='Progress is saved in this browser. Use the buttons to keep a copy.';
  }
  if(warning) saveNote('bad',warning);
}

// Adopt the file on boot. Synchronous localStorage has already rendered the map,
// so this only corrects it if the file disagrees.
function connectFileStore(){
  if(typeof fetch!=='function' || !serverPossible()){ setStoreLabel(false); return; }
  fetch(progressUrl(),{cache:'no-store'}).then(function(response){
    if(!response.ok) throw new Error('no store');
    return response.json();
  }).then(function(data){
    fileStore=true;
    var hasSaved = data && data.done && Object.keys(data.done).length;
    if(hasSaved){
      state=normalizeSave(migrateSave(data));
      try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(error){}
      renderMap();
    }else if(Object.keys(state.done||{}).length){
      pushToFile();          // this browser had progress the file did not; seed it
    }
    // nothing anywhere yet: leave the disk alone until there is a win to record
    setStoreLabel(true);
  }).catch(function(){
    fileStore=false;
    setStoreLabel(false);
  });
}

// Keep only stops this build has, and fill in missing stars.
function normalizeSave(data){
  var normalized={schema:SCHEMA, player:sanitizeName(data.player), xp:toXp(data.xp), stars:{}, done:{}};
  Object.keys(data.done||{}).forEach(function(id){
    if(stageIndex(id)===-1) return;
    normalized.done[id]=true;
    normalized.stars[id]=(data.stars&&data.stars.hasOwnProperty(id))?data.stars[id]:1;
  });
  return normalized;
}

/* ---------- progress as a file ----------
   A browser page cannot write to disk on its own, so this is explicit:
   a button that hands you a file, and a file picker that reads one back.
   In the published artifact the save goes through the downloads capability;
   run locally there is no capability, so a Blob link does the job. */

function serializeProgress(){
  return JSON.stringify({
    format:'loopline-progress', v:2, schema:SCHEMA,
    player:state.player||'',
    savedAt:new Date().toISOString(),
    xp:state.xp||0, stars:state.stars||{}, done:state.done||{}
  },null,2);
}

function progressFilename(){
  var progressSummary=progress();
  var slug=playerSlug();
  return 'loopline-'+(slug?slug+'-':'')+progressSummary.done+'of'+progressSummary.total+'-'+
         new Date().toISOString().slice(0,10)+'.json';
}

function saveNote(className,html){
  var noteEl=document.getElementById('saveNote');
  if(noteEl) noteEl.innerHTML='<div class="savenote '+className+'">'+html+'</div>';
}

function offerBlobDownload(name,text){
  try{
    var blob=new Blob([text],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var link=document.createElement('a');
    link.href=url; link.download=name;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    return true;
  }catch(error){ return false; }
}

function showRawProgress(text){
  saveNote('',
    '<strong>Copy this and keep it somewhere.</strong> Paste it back with '+
    '“Load from a file” — save it as a <code>.json</code> file first.'+
    '<textarea class="saveblob" id="rawBlob" readonly></textarea>');
  var textarea=document.getElementById('rawBlob');
  textarea.value=text; textarea.focus(); textarea.select();
}

function exportProgress(){
  var text=serializeProgress(), name=progressFilename();
  var framed = (typeof window.claude!=='undefined' && window.claude && typeof window.claude.use==='function');

  if(framed){
    saveNote('','Preparing your file…');
    window.claude.use('downloads').then(function(downloads){
      if(!downloads){
        // Framed by a viewer that will not save files: a link click is inert here,
        // so hand over the text instead of pretending something happened.
        showRawProgress(text);
        return;
      }
      return downloads.save({filename:name,data:text}).then(function(){
        saveNote('good','Saved as <code>'+esc(name)+'</code>. Load it back on any browser with “Load from a file”.');
      }).catch(function(downloadError){
        var code=(downloadError&&downloadError.code)||'unavailable';
        if(code==='declined') saveNote('','No file saved — you can ask again whenever.');
        else if(code==='rate_limited') saveNote('bad','A save prompt is already open. Answer that one, then try again.');
        else showRawProgress(text);
      });
    }).catch(function(){ showRawProgress(text); });
    return;
  }

  if(offerBlobDownload(name,text)){
    saveNote('good','Saved as <code>'+esc(name)+'</code> — check your downloads folder.');
  }else{
    showRawProgress(text);
  }
}

var pendingImport=null;

function readProgressFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onerror=function(){ saveNote('bad','That file could not be read.'); };
  reader.onload=function(){
    var data;
    try{ data=JSON.parse(String(reader.result)); }
    catch(parseError){ saveNote('bad','That is not a progress file — it is not valid JSON.'); return; }
    if(!data || data.format!=='loopline-progress' || typeof data.done!=='object'){
      saveNote('bad','That JSON is not a Loop Line progress file.'); return;
    }
    data=migrateSave(data, data.v===1?1:undefined);

    // Count only stops this build actually has, so an old file cannot inflate the total.
    var known=0, skipped=0;
    Object.keys(data.done).forEach(function(id){
      if(stageIndex(id)===-1) return;
      var starCount=data.stars&&data.stars.hasOwnProperty(id)?data.stars[id]:1;
      if(starCount===0) skipped++; else known++;
    });
    var unknown=Object.keys(data.done).filter(function(id){return stageIndex(id)===-1;}).length;

    pendingImport={schema:SCHEMA, player:data.player||state.player||'', xp:toXp(data.xp), stars:data.stars||{}, done:data.done};
    var whose=sanitizeName(data.player);
    saveNote('',
      '<strong>'+(whose?esc(whose)+'\u2019s file: ':'This file holds ')+known+' cleared'+
      (skipped?', '+skipped+' skipped':'')+
      ' and '+esc(toXp(data.xp))+' XP.</strong>'+
      (unknown?' '+unknown+' stop'+(unknown>1?'s in it are':' in it is')+' not in this version and will be ignored.':'')+
      '<br>Loading it replaces what is on this browser now.'+
      '<div><button class="btn" id="doImport" type="button">Replace my progress</button></div>');
    document.getElementById('doImport').addEventListener('click',function(){
      // Already migrated above, and pendingImport now carries the current
      // schema — migrating a second time would re-apply MAPS and shift
      // every mapped stop to its neighbour.
      state=normalizeSave(pendingImport); save(); pendingImport=null;
      renderMap();
      saveNote('good','Progress loaded.');
    });
  };
  reader.readAsText(file);
}

var allStages=[];
// stage.label is the human-facing position ("3.4"), recomputed on every load.
// stage.id is the stable name that goes in a save file and never moves.
ZONES.forEach(function(zone){ zone.stages.forEach(function(stage,index){ stage.zone=zone; stage.label=zone.id+'.'+(index+1); allStages.push(stage); }); });

function stageIndex(id){ for(var i=0;i<allStages.length;i++) if(allStages[i].id===id) return i; return -1; }
function isOpen(stage){
  if(devMode) return true;
  var index=stageIndex(stage.id);
  if(index===0)return true;
  return !!state.done[allStages[index-1].id];
}
function zoneOpen(zone){ return isOpen(zone.stages[0]) || zone.stages.some(function(stage){return state.done[stage.id];}); }

var KIND_LABEL={learn:'Read',mcq:'Predict',write:'Write',boss:'Boss'};

/* =====================================================================
   4. VIEWS
   ===================================================================== */
var mapView=document.getElementById('mapView');
var stageView=document.getElementById('stageView');
var xpEl=document.getElementById('xp');
var progBtn=document.getElementById('progBtn');

// One pass over the line: what's cleared, what was skipped, what's left.
function progress(){
  var done=0, skipped=0, unsolved=[];
  allStages.forEach(function(stage){
    if(!state.done[stage.id]) return;
    var starCount = state.stars.hasOwnProperty(stage.id) ? state.stars[stage.id] : 1;
    // A stop won with a hint IS finished. Only a skip left something undone,
    // so only a skip belongs in a to-do list. Stars carry the rest on the map.
    if(starCount===0){ skipped++; unsolved.push(stage); }
    else done++;
  });
  return {
    done:done, skipped:skipped, total:allStages.length,
    left: allStages.length - done - skipped,
    unsolved: unsolved
  };
}

// The tick strip is the one thing on screen from every view: where you are,
// what is behind you, and how much line is left.
function renderProgress(currentId){
  var progressSummary=progress();
  var ticks=allStages.map(function(stage){
    var tickClass='tick', starCount=state.stars.hasOwnProperty(stage.id)?state.stars[stage.id]:null;
    if(state.done[stage.id]) tickClass += (starCount===0 ? ' skipped' : ' done');
    if(stage.id===currentId) tickClass+=' here';
    return '<span class="'+tickClass+'" style="--tc:'+stage.zone.color+'" title="'+esc(stage.title)+'"></span>';
  }).join('');
  progBtn.innerHTML =
    (currentId?'<span class="back">&lsaquo;</span>':'')+
    '<span class="ticks">'+ticks+'</span>'+
    '<span class="progtext">'+progressSummary.done+' / '+progressSummary.total+
    (progressSummary.skipped?' · '+progressSummary.skipped+' skipped':'')+'</span>';
  progBtn.setAttribute('aria-label',
    progressSummary.done+' of '+progressSummary.total+' stops cleared'+(progressSummary.skipped?', '+progressSummary.skipped+' skipped':'')+'. Back to the line.');
}

function esc(value){ return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var ZONE_WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function zoneWord(count){ return ZONE_WORDS[count]||String(count); }

function highlight(code){
  // Comments and strings are lifted out before any markup is generated, so the
  // later passes can never match the class attributes this function just wrote.
  var html=esc(code), stashed=[];
  function stash(match){ stashed.push(match); return '\uE000'+(stashed.length-1)+'\uE001'; }
  html=html.replace(/\/\/[^\n]*/g,function(match){ return stash('<span class="cm">'+match+'</span>'); });
  html=html.replace(/"[^"\n]*"|'[^'\n]*'|`[^`\n]*`/g,function(match){ return stash('<span class="st">'+match+'</span>'); });
  html=html.replace(/\b(const|let|var|if|else|for|while|function|return|of|in)\b/g,'<span class="kw">$1</span>');
  html=html.replace(/\bconsole\b/g,'<span class="nm">console</span>');
  return html.replace(/\uE000(\d+)\uE001/g,function(fullMatch,digits){ return stashed[+digits]; });
}
function stars(count){ return '★★★'.slice(0,count)+'☆☆☆'.slice(0,3-count); }

function renderWelcome(again){
  stageView.classList.add('hidden');
  mapView.classList.remove('hidden');
  document.getElementById('starmeter').classList.add('hidden');
  document.getElementById('devbar').classList.add('hidden');
  progBtn.innerHTML='';
  window.scrollTo(0,0);

  mapView.innerHTML='<div class="panel welcome">'+
    '<div class="eyebrow">'+(again?'Change the name on this line':'Before we set off')+'</div>'+
    '<h1>'+(again?'What should I call you instead?':'What should I call you?')+'</h1>'+
    '<p>It goes on your line and into the one stage that asks you to print a greeting, '+
    'so the code you write says your own name back to you.</p>'+
    '<div class="namerow">'+
      '<input class="nameinput" id="nameIn" type="text" maxlength="24" autocomplete="given-name" '+
      'placeholder="First name is plenty" value="'+esc(state.player||'')+'" '+
      'aria-label="Your name">'+
      '<button class="btn" id="nameGo" type="button">'+(again?'Save':'Start the line')+'</button>'+
      (again?'<button class="btn sec" id="nameCancel" type="button">Cancel</button>':'')+
    '</div>'+
    '<div id="nameWarn"></div>'+
    '<p class="fineprint">Stored in this browser only, alongside your progress — never sent anywhere. '+
    'You can change it any time from the foot of the map.</p>'+
    '</div>';

  var input=document.getElementById('nameIn');
  var warnEl=document.getElementById('nameWarn');
  input.focus();
  input.select();

  function commit(){
    var cleanName=sanitizeName(input.value);
    if(!cleanName){
      warnEl.innerHTML='<div class="namewarn">'+
        (input.value.trim() ? 'Letters, numbers, spaces, hyphens and apostrophes only.' : 'Type a name to carry on.')+
        '</div>';
      input.focus();
      return;
    }
    var prevSlug=playerSlug();
    state.player=cleanName;
    if(playerSlug()!==prevSlug){
      // A genuinely different person, not just a re-cased or corrected
      // version of the same name — do not hand them whoever was playing
      // here before. Start blank and let connectFileStore pull THEIR own
      // file if the server already has one; only a real win pushes anything,
      // so there is no risk of a blank save overwriting an existing file.
      state={schema:SCHEMA, player:cleanName, xp:0, stars:{}, done:{}};
      fileStore=false;
      try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(error){}
      renderMap();
      connectFileStore();
    }else{
      save();
      renderMap();
    }
  }
  document.getElementById('nameGo').addEventListener('click',commit);
  input.addEventListener('keydown',function(event){ if(event.key==='Enter'){ event.preventDefault(); commit(); } });
  var cancelBtn=document.getElementById('nameCancel');
  if(cancelBtn) cancelBtn.addEventListener('click',renderMap);
}

function renderMap(){
  if(!state.player) return renderWelcome(false);
  document.getElementById('starmeter').classList.add('hidden');
  renderProgress(null);
  renderDevBar(null);
  stageView.classList.add('hidden');
  mapView.classList.remove('hidden');

  var progressSummary=progress();
  var html='<div class="map-head">'+
    '<div class="eyebrow">'+esc(state.player)+'\u2019s line \u00b7 '+progressSummary.total+' stops in '+zoneWord(ZONES.length)+' zones</div>'+
    '<h1>Ride the line, one concept per station.</h1>'+
    '<p>Every stop reuses what the last one taught. By the interchange at the end of this stretch you will be writing loops that filter data — with nothing memorised and nothing skipped.</p>'+
    '<div class="tally">'+
      '<span><b>'+progressSummary.done+'</b> cleared</span>'+
      (progressSummary.skipped?'<span><b>'+progressSummary.skipped+'</b> skipped</span>':'')+
      '<span><b>'+progressSummary.left+'</b> to go</span>'+
      '<span><b>'+esc(toXp(state.xp))+'</b> XP</span>'+
    '</div>'+
    '</div>';

  if(devMode){
    html+='<div class="revisit" style="border-left-color:var(--accent)">'+
       '<div class="eyebrow">Test mode is on</div>'+
       '<p style="margin:6px 0 0;font-size:14px;color:var(--muted)">Every stop is unlocked and the bar above jumps straight to any of them. '+
       'Stars, XP and skips show normally so you can see a stage score itself — but none of it is saved. '+
       'Nothing here touches a real run: reload, or turn test mode off, and it is exactly as it was before you started poking around. '+
       'Turn it off to see what your colleague sees.</p></div>';
  }

  if(progressSummary.unsolved.length){
    var unsolvedCount=progressSummary.unsolved.length;
    html+='<div class="revisit"><div class="eyebrow">Not solved yet</div>'+
       '<p style="margin:6px 0 0;font-size:14px;color:var(--muted)">'+
       unsolvedCount+' stop'+(unsolvedCount>1?'s had their':' had its')+' answer filled in rather than worked out. '+
       'Worth another run once the later stops have made it click.'+
       '</p><div class="chips">'+
       progressSummary.unsolved.map(function(stage){
         return '<button class="rchip skip" data-stage="'+stage.id+'">'+
                esc(stage.title)+'<span class="why">skipped</span></button>';
       }).join('')+
       '</div></div>';
  }

  html+='<div class="linemap">';

  ZONES.forEach(function(zone){
    var open=zoneOpen(zone);
    var hasBoss=zone.stages.some(function(stage){return stage.kind==='boss';});
    html+='<div class="station '+(open?'open':'locked')+(hasBoss?' interchange':'')+'" style="--zc:'+zone.color+'">'+
       '<div class="stn-mark"></div><div class="stn-card">'+
       '<div class="eyebrow">Zone '+zone.id+' · '+zone.stages.length+' stop'+(zone.stages.length>1?'s':'')+(hasBoss?' · interchange':'')+'</div>'+
       '<div class="stn-title"><h3>'+zone.name+'</h3></div>'+
       '<p>'+zone.blurb+'</p>'+
       '<div class="stn-teaches">'+zone.teaches.map(function(skill){return '<span class="tk">'+esc(skill)+'</span>';}).join('')+'</div>';
    if(open){
      html+='<div class="stops">';
      zone.stages.forEach(function(stage){
        var stageOpen=isOpen(stage), stageDone=state.done[stage.id];
        var starCount = state.stars.hasOwnProperty(stage.id) ? state.stars[stage.id] : 1;
        var badge = !stageDone ? (stageOpen?'':' <span class="lockchip">·</span>')
                  : (starCount===0 ? ' <span class="skipchip">skipped</span>'
                            : ' <span class="stars">'+stars(starCount)+'</span>');
        html+='<button class="stop'+(stageDone?' done':'')+(stageDone&&starCount===0?' skipped':'')+(stage.kind==='boss'?' boss':'')+'" '+(stageOpen?'':'disabled')+' data-stage="'+stage.id+'">'+
           '<span class="kind">'+KIND_LABEL[stage.kind]+'</span> '+esc(stage.title)+ badge +
           '</button>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });

  LOCKED.forEach(function(zone){
    html+='<div class="station locked" style="--zc:'+zone.color+'">'+
       '<div class="stn-mark"></div><div class="stn-card">'+
       '<div class="eyebrow">Zone '+zone.id+' · not built yet</div>'+
       '<div class="stn-title"><h3>'+zone.name+'</h3></div>'+
       '<p>'+zone.blurb+'</p>'+
       '<div class="stn-teaches">'+zone.teaches.map(function(skill){return '<span class="tk">'+esc(skill)+'</span>';}).join('')+'</div>'+
       '</div></div>';
  });

  html+='</div><p class="note"><strong>Stars, and how you keep them.</strong> Every stop starts you on ★★★. '+
     'Three misses and the first hint appears by itself; each further miss brings the next one. '+
     'A rung costs a star whether you asked for it or waited for it — so stars measure how much help was needed, not who was willing to press a button. '+
     'After every hint is out, a last-resort button fills in the answer and marks the stop skipped. '+
     'Replaying a stop can only raise your stars, never lower them.'+
     (LOCKED.length ? ('<br><br>'+(progressSummary.done+progressSummary.skipped)+' of '+allStages.length+' stops attempted across '+zoneWord(ZONES.length)+' built zones. '+
       'Zone'+(LOCKED.length===1?'':'s')+' '+LOCKED.map(function(zone){return zone.id;}).join(', ')+' show'+(LOCKED.length===1?'s':'')+' the shape of what is still coming.') : '')+
     '</p>'+
     '<div class="savebar">'+
       '<span class="lbl" id="storeLabel">Checking where progress is stored…</span>'+
       '<button class="whoami" id="whoBtn" type="button">Not '+esc(state.player)+'?</button>'+
       '<button id="expBtn" type="button">Save progress to a file</button>'+
       '<label class="fake" for="impFile">Load from a file</label>'+
       '<input type="file" id="impFile" accept=".json,application/json" hidden>'+
       (devMode?'':'<button class="whoami" id="bossBtn" type="button">Boss login</button>')+
     '</div><div id="saveNote"></div>';
  mapView.innerHTML=html;

  Array.prototype.forEach.call(mapView.querySelectorAll('.stop, .rchip'),function(button){
    button.addEventListener('click',function(){ openStage(button.getAttribute('data-stage')); });
  });

  setStoreLabel(fileStore);
  var whoBtn=document.getElementById('whoBtn');
  if(whoBtn) whoBtn.addEventListener('click',function(){ renderWelcome(true); });
  var bossBtn=document.getElementById('bossBtn');
  if(bossBtn) bossBtn.addEventListener('click',renderBossLogin);
  var expBtn=document.getElementById('expBtn');
  if(expBtn) expBtn.addEventListener('click',exportProgress);
  var impFile=document.getElementById('impFile');
  if(impFile) impFile.addEventListener('change',function(){
    readProgressFile(this.files&&this.files[0]);
    this.value='';   // so picking the same file twice still fires
  });
  xpEl.textContent=state.xp;
}

/* ---------- stage ---------- */
var currentStage=null, attempts=0;
var helpUsed=0;      // rungs revealed, however they were revealed
var misses=0;        // wrong attempts on this stop
var lastSrc=null;    // so re-running unchanged code is not counted as a fresh attempt
var revealed={};     // which rungs are already on screen
var skippedThis=false;

// how many misses before each rung shows itself.
// MCQ escalates a miss earlier: with four options, three wrong guesses is most of the way
// to solving it by elimination, which teaches nothing.
function thresholds(){
  return currentStage.kind==='mcq' ? {nudge:2, example:3} : {nudge:3, example:4, hint:5, escape:6};
}

var starmeterEl=document.getElementById('starmeter');

function currentStars(){ return Math.max(1, 3-helpUsed); }

function setStars(){
  var starCount=currentStars();
  starmeterEl.classList.remove('hidden');
  starmeterEl.innerHTML='<span class="pips">'+
    '★★★'.slice(0,starCount)+
    '<span class="spent">'+'☆☆☆'.slice(0,3-starCount)+'</span></span>'+
    '<span class="lbl">on this stop</span>';
}

function openStage(id){
  currentStage=allStages[stageIndex(id)];
  attempts=0; helpUsed=0; misses=0;
  lastSrc=null; revealed={}; skippedThis=false;
  setStars();
  if(currentStage.kind==='learn') starmeterEl.classList.add('hidden');
  mapView.classList.add('hidden');
  stageView.classList.remove('hidden');
  renderProgress(currentStage.id);
  renderDevBar(currentStage.id);
  window.scrollTo(0,0);
  renderStage();
}

function ladderMarkup(stage){
  if(!stage.example && !stage.hint) return '';
  var html='<div class="ladder"><div class="eyebrow">Help — or wait, and it comes to you</div>'+
    '<p style="margin:6px 0 0;font-size:13px;color:var(--muted)">Miss three times and the first hint appears on its own. '+
    'Each one after that arrives a miss later. Asking early costs the same as waiting.</p>';
  if(stage.example) html+='<button class="rung" id="exBtn">Show the same idea somewhere else'+
    '<span class="cost">−1 ★</span></button>';
  if(stage.hint) html+='<button class="rung" id="hintBtn">Show the answer shape'+
    '<span class="cost">−1 ★</span></button>';
  html+='<div id="helpSlot"></div></div>';
  return html;
}

function reinforceRow(stage){
  if(!stage.reinforces||!stage.reinforces.length)return '';
  return '<div class="reinf"><div class="eyebrow">Carried forward from earlier stops</div>'+
    '<div class="row">'+stage.reinforces.map(function(skill){return '<span class="tk">'+esc(skill)+'</span>';}).join('')+'</div></div>';
}

function renderStage(){
  var stage=currentStage;
  var left='<div class="panel brief" style="border-left:4px solid '+stage.zone.color+'">'+
    '<div class="eyebrow" style="color:'+stage.zone.color+'">Zone '+stage.zone.id+' · '+stage.zone.name+' · '+KIND_LABEL[stage.kind]+'</div>'+
    '<h2>'+esc(tpl(stage.title))+'</h2>'+ tpl(stage.brief) +
    (stage.task?'<p style="margin-top:14px"><strong>Your turn:</strong> '+tpl(stage.task)+'</p>':'')+
    reinforceRow(stage)+
    ladderMarkup(stage)+
    '</div>';

  var right='<div class="panel">'+ renderWork(stage) +'</div>';
  stageView.innerHTML='<div class="stage">'+left+right+'</div>';
  wireStage();
}

function renderWork(stage){
  if(stage.kind==='learn'){
    return '<div class="eyebrow" style="margin-bottom:10px">Worked example</div>'+
      '<pre class="code">'+highlight(tpl(stage.code))+'</pre>'+
      (stage.codeNote?'<p style="font-size:14.5px;color:var(--muted);margin:0 0 16px">'+tpl(stage.codeNote)+'</p>':'')+
      '<div class="toolbar"><button class="btn" id="gotBtn">Got it — next stop</button></div>';
  }
  if(stage.kind==='mcq'){
    return '<div class="eyebrow" style="margin-bottom:10px">Read it, then predict</div>'+
      '<pre class="code">'+highlight(tpl(stage.code))+'</pre>'+
      '<p style="font-weight:600;margin:0 0 12px">'+esc(tpl(stage.question))+'</p>'+
      '<div id="opts">'+stage.options.map(function(option,index){
        return '<button class="opt" data-i="'+index+'">'+esc(tpl(option)).replace(/\n/g,'<br>')+'</button>';
      }).join('')+'</div><div id="verdict"></div>';
  }
  return '<div class="eyebrow" style="margin-bottom:10px">Editor</div>'+
    '<textarea class="editor" id="ed" spellcheck="false">'+esc(tpl(stage.starter))+'</textarea>'+
    '<div class="toolbar"><button class="btn" id="runBtn">Run</button>'+
    '<button class="btn sec" id="resetCodeBtn">Start over</button></div>'+
    '<div class="board"><div class="board-head">Departure board · console output</div>'+
    '<div class="board-body" id="board"><span class="empty">Nothing printed yet.</span></div></div>'+
    '<div id="verdict"></div>';
}

function award(){
  var stage=currentStage;
  var starsEarned = stage.kind==='learn' ? 3 : (skippedThis ? 0 : currentStars());
  var first = !state.done[stage.id];
  state.done[stage.id]=true;
  // replaying a stop can only raise your stars, never lower them
  state.stars[stage.id]=Math.max(state.stars[stage.id]||0, starsEarned);
  if(first) state.xp += (stage.kind==='boss'?25:10);
  save();
}

function finishStage(){
  var stage=currentStage;
  var starCount=state.stars.hasOwnProperty(stage.id)?state.stars[stage.id]:1;
  var next=allStages[stageIndex(stage.id)+1];
  var caption = starCount===0 ? 'Skipped — the answer was filled in for you'
              : starCount===3 ? 'Three stars — solved unaided'
              : starCount===2 ? 'Two stars — one rung of help used'
              : 'One star — most of the help used';
  stageView.innerHTML='<div class="panel finish">'+
    '<div class="starburst">'+(starCount===0?'☆☆☆':stars(starCount))+'</div>'+
    '<div class="eyebrow" style="margin-bottom:14px">'+caption+
      (starCount<3?' · replay it later to win the rest back':'')+'</div>'+
    '<h2 class="big">'+(starCount===0?'Stop skipped':(stage.kind==='boss'?'Interchange cleared':'Stop cleared'))+'</h2>'+
    '<p>'+(starCount===0?'The line is open ahead of you either way. Come back to this one once the next few stops have made it click.':(stage.kind==='boss'?'You just wrote code that walks a list, decides what matters, and keeps a running total.':'Banked. '+(next?'Next stop uses it again.':'')))+'</p>'+
    '<div class="toolbar" style="justify-content:center">'+
    (next?'<button class="btn" id="nextBtn">Next stop: '+esc(next.title)+'</button>':'')+
    '<button class="btn sec" id="mapBtn">Back to the line</button></div>'+
    (next?'':'<p style="margin-top:22px">That is the last stop on the line — all '+allStages.length+' of them, from your first <code>console.log</code> to here. Nothing along the way was memorised: every stop stood on the one before it.</p>')+
    '</div>';
  var nextBtn=document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click',function(){ openStage(next.id); });
  document.getElementById('mapBtn').addEventListener('click',renderMap);
  xpEl.textContent=state.xp;
}

function showVerdict(ok,title,msg){
  document.getElementById('verdict').innerHTML=
    '<div class="verdict '+(ok?'pass':'fail')+'"><b>'+esc(title)+'</b>'+esc(tpl(msg))+'</div>'+
    (ok?'<div class="toolbar"><button class="btn" id="contBtn">Continue</button></div>':'');
  var continueBtn=document.getElementById('contBtn');
  if(continueBtn) continueBtn.addEventListener('click',finishStage);
  if(!ok) escalate();
}

/* ---------- the help ladder ----------
   Three rungs, revealed in order. Each one costs a star whether it was asked for
   or handed over automatically — so the meter measures how much help was needed,
   not how willing someone was to press a button. */

function slot(){ return document.getElementById('helpSlot'); }

function addRung(html){
  var slotEl=slot();
  if(!slotEl) return;
  slotEl.insertAdjacentHTML('beforeend','<div class="revealed">'+html+'</div>');
  helpUsed++;
  setStars();
}

function markSpent(id,label){
  var buttonEl=document.getElementById(id);
  if(!buttonEl) return;
  buttonEl.classList.remove('offered');
  buttonEl.classList.add('spent');
  buttonEl.disabled=true;
  buttonEl.innerHTML=label+'<span class="cost">spent</span>';
}

function revealNudge(){
  if(revealed.nudge || !currentStage.nudge) return;
  revealed.nudge=true;
  addRung('<div class="nudge"><div class="eyebrow">A push in the right direction'+
          '<span class="cost">−1 ★</span></div>'+tpl(currentStage.nudge)+'</div>');
}

function revealExample(){
  if(revealed.example || !currentStage.example) return;
  revealed.example=true;
  addRung('<div class="example"><div class="eyebrow">The same shape, a different subject</div>'+
          '<pre class="code">'+highlight(tpl(currentStage.example.code))+'</pre>'+
          '<p class="note">'+tpl(currentStage.example.note)+'</p></div>');
  markSpent('exBtn','Same idea, elsewhere');
}

function revealHint(){
  if(revealed.hint || !currentStage.hint) return;
  revealed.hint=true;
  addRung('<div class="hintbox"><strong>The shape you need:</strong><br>'+
          '<code class="inline">'+esc(tpl(currentStage.hint))+'</code></div>');
  markSpent('hintBtn','Answer shape');
}

function showEscape(){
  if(revealed.escape || !currentStage.solution) return;
  revealed.escape=true;
  var slotEl=slot();
  if(!slotEl) return;
  slotEl.insertAdjacentHTML('beforeend',
    '<div class="escape revealed"><p>Still not landing? Take the working answer, read it against '+
    'what you wrote, and move on. This stop will be marked as skipped — come back and beat it later.</p>'+
    '<button class="btn" id="escBtn">Fill in the answer and move on</button></div>');
  document.getElementById('escBtn').addEventListener('click',function(){
    var editorEl=document.getElementById('ed');
    if(editorEl){ editorEl.value=tpl(currentStage.solution); editorEl.focus(); }
    skippedThis=true;
    helpUsed=3; setStars();
    document.getElementById('escBtn').disabled=true;
    document.getElementById('escBtn').textContent='Answer filled in — press Run when you have read it';
  });
}

// Called after every miss. Thresholds are cumulative, so one rung arrives per miss.
function escalate(){
  var thresholdsObj=thresholds();
  if(thresholdsObj.nudge!==undefined   && misses>=thresholdsObj.nudge)   revealNudge();
  if(thresholdsObj.example!==undefined && misses>=thresholdsObj.example) revealExample();
  if(thresholdsObj.hint!==undefined    && misses>=thresholdsObj.hint)    revealHint();
  if(thresholdsObj.escape!==undefined  && misses>=thresholdsObj.escape)  showEscape();
}

function wireStage(){
  var stage=currentStage;
  // Asking pulls the rung forward; it does not change what it costs.
  // The nudge comes first either way, so nobody sees the answer before the question.
  var exampleBtn=document.getElementById('exBtn');
  if(exampleBtn) exampleBtn.addEventListener('click',function(){ revealNudge(); revealExample(); });

  var hintBtnEl=document.getElementById('hintBtn');
  if(hintBtnEl) hintBtnEl.addEventListener('click',function(){ revealNudge(); revealExample(); revealHint(); });

  var gotBtnEl=document.getElementById('gotBtn');
  if(gotBtnEl) gotBtnEl.addEventListener('click',function(){ award(); finishStage(); });

  var opts=document.getElementById('opts');
  if(opts) Array.prototype.forEach.call(opts.querySelectorAll('.opt'),function(optionBtn){
    optionBtn.addEventListener('click',function(){
      var chosenIndex=+optionBtn.getAttribute('data-i');
      attempts++;
      if(chosenIndex===stage.answer){
        Array.prototype.forEach.call(opts.querySelectorAll('.opt'),function(otherOption){otherOption.disabled=true;});
        optionBtn.classList.add('right');
        award();
        showVerdict(true,'Correct.',stage.explain);
      }else{
        optionBtn.classList.add('wrong'); optionBtn.disabled=true;
        misses++;
        showVerdict(false,'Not that one.','Trace it line by line and try again — the answer is still on the board.');
      }
    });
  });

  var runBtnEl=document.getElementById('runBtn');
  if(runBtnEl) runBtnEl.addEventListener('click',function(){
    var src=document.getElementById('ed').value;
    // Running the same characters twice is not a second attempt — an accidental
    // double-click should never spend a rung.
    var repeat = (lastSrc !== null && src.trim() === lastSrc.trim());
    lastSrc = src;
    var result=runCode(src);
    var board=document.getElementById('board');
    var html='';
    if(result.logs.length) html+=result.logs.map(esc).join('\n');
    else html+='<span class="empty">Nothing printed.</span>';
    if(result.err) html+=(result.logs.length?'\n':'')+'<span class="err">⚠ '+esc(result.err)+'</span>';
    board.innerHTML=html;
    attempts++;
    if(result.err){ if(!repeat) misses++; showVerdict(false,'It stopped early.',result.err); return; }
    // checks inspect code, not commentary
    var checkResult=stage.check(result.logs, stripComments(src));
    if(checkResult.ok){ award(); showVerdict(true, skippedThis?'That is the answer, running.':'That works.', checkResult.msg); }
    else{ if(!repeat) misses++; showVerdict(false,'Not quite yet.',checkResult.msg); }
  });

  var resetBtnEl=document.getElementById('resetCodeBtn');
  if(resetBtnEl) resetBtnEl.addEventListener('click',function(){
    document.getElementById('ed').value=tpl(stage.starter);
    document.getElementById('board').innerHTML='<span class="empty">Nothing printed yet.</span>';
    document.getElementById('verdict').innerHTML='';
  });

  var editorEl=document.getElementById('ed');
  if(editorEl) editorEl.addEventListener('keydown',function(event){
    if(event.key==='Tab'){
      event.preventDefault();
      var selStart=editorEl.selectionStart, selEnd=editorEl.selectionEnd;
      editorEl.value=editorEl.value.slice(0,selStart)+'  '+editorEl.value.slice(selEnd);
      editorEl.selectionStart=editorEl.selectionEnd=selStart+2;
    }
  });
}

/* ---------- test mode ----------
   Off unless someone turns it on, so a learner never sees it.
   Two ways in: ?dev on the URL, or Ctrl/Cmd+Shift+D (the artifact URL
   cannot always carry a query string, so the shortcut is the reliable one). */

var devbar=document.getElementById('devbar');

function renderDevBar(currentId){
  if(!devMode){ devbar.classList.add('hidden'); devbar.innerHTML=''; return; }
  var optionsHtml=ZONES.map(function(zone){
    return '<optgroup label="Zone '+zone.id+' — '+zone.name+'">'+
      zone.stages.map(function(stage){
        var starCount=state.stars.hasOwnProperty(stage.id)?state.stars[stage.id]:null;
        var mark = !state.done[stage.id] ? '' : (starCount===0 ? '  · skipped' : '  · '+stars(starCount));
        return '<option value="'+stage.id+'"'+(stage.id===currentId?' selected':'')+'>'+
               stage.label+'  '+esc(stage.title)+mark+'</option>';
      }).join('')+'</optgroup>';
  }).join('');
  devbar.innerHTML='<div class="devbar-in">'+
    '<span class="tag">Test mode</span>'+
    '<span>every stop unlocked</span>'+
    '<select id="devJump" aria-label="Jump to a stop">'+
      '<option value="">Jump to a stop…</option>'+optionsHtml+
    '</select>'+
    '<span style="opacity:.6">toggle with <kbd>Ctrl/⌘ + Shift + D</kbd></span>'+
    '<button class="off" id="devOff" type="button">Turn off</button>'+
    '</div>';
  devbar.classList.remove('hidden');
  document.getElementById('devJump').addEventListener('change',function(){
    if(this.value) openStage(this.value);
  });
  document.getElementById('devOff').addEventListener('click',function(){ setDev(false); });
}

function setDev(on){
  devMode=!!on;
  try{ on ? localStorage.setItem(DEVKEY,'1') : localStorage.removeItem(DEVKEY); }catch(error){}
  // Turning test mode off ends a boss session too, however it was started —
  // "off" should mean off, not still logged in behind the scenes.
  if(!on){ try{ sessionStorage.removeItem(BOSSKEY); }catch(error){} }
  renderMap();
}

// Boss login sets devMode the same way Ctrl+Shift+D does, but through
// sessionStorage rather than localStorage: it survives a reload of this tab
// (so refreshing mid-test does not boot you out), but a new tab or a
// reopened browser starts logged out again, asking for the password fresh.
function bossLogin(password){
  if(password!==BOSS_PASSWORD) return false;
  devMode=true;
  try{ sessionStorage.setItem(BOSSKEY,'1'); }catch(error){}
  renderMap();
  return true;
}

function renderBossLogin(){
  stageView.classList.add('hidden');
  mapView.classList.remove('hidden');
  document.getElementById('starmeter').classList.add('hidden');
  document.getElementById('devbar').classList.add('hidden');
  progBtn.innerHTML='';
  window.scrollTo(0,0);

  mapView.innerHTML='<div class="panel welcome">'+
    '<div class="eyebrow">Boss login</div>'+
    '<h1>Every level, unlocked.</h1>'+
    '<p>Same test mode as Ctrl/Cmd+Shift+D — every stop open, a jump-to dropdown for any lesson. '+
    'This just gets you there without the shortcut.</p>'+
    '<div class="namerow">'+
      '<input class="nameinput" id="bossPw" type="password" autocomplete="off" '+
      'placeholder="Password" aria-label="Boss password">'+
      '<button class="btn" id="bossGo" type="button">Log in</button>'+
      '<button class="btn sec" id="bossCancel" type="button">Cancel</button>'+
    '</div>'+
    '<div id="bossWarn"></div>'+
    '</div>';

  var input=document.getElementById('bossPw');
  var warnEl=document.getElementById('bossWarn');
  input.focus();

  function commit(){
    if(!bossLogin(input.value)){
      warnEl.innerHTML='<div class="namewarn">That is not it.</div>';
      input.value='';
      input.focus();
    }
  }
  document.getElementById('bossGo').addEventListener('click',commit);
  input.addEventListener('keydown',function(event){ if(event.key==='Enter'){ event.preventDefault(); commit(); } });
  document.getElementById('bossCancel').addEventListener('click',renderMap);
}

document.addEventListener('keydown',function(event){
  if((event.ctrlKey||event.metaKey) && event.shiftKey && (event.key==='D'||event.key==='d')){
    event.preventDefault();
    setDev(!devMode);
  }
});

progBtn.addEventListener('click',renderMap);
document.getElementById('resetBtn').addEventListener('click',function(){
  var confirmed=window.confirm(
    'Reset all progress for '+(state.player||'you')+'?\n\n'+
    'Every star, skip and cleared stop is erased for good'+
    (fileStore?' — including progress-'+playerSlug()+'.json on disk':'')+'. This cannot be undone.'
  );
  if(!confirmed) return;
  var keepName=state.player;
  state={schema:SCHEMA,player:keepName,xp:0,stars:{},done:{}}; save(); renderMap();
  saveNote('','Progress cleared. If you saved a file earlier, “Load from a file” brings it back.');
});

renderMap();
// A brand new visitor has no name yet — nothing to load until the welcome
// screen commits one (see commit(), which calls this itself once it does).
if(state.player) connectFileStore();
</script>
