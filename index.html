<script>
/* =====================================================================
   1. SANDBOX — loop guard by condition rewriting
   ===================================================================== */
function splitTop(text){
  var parts=[],depth=0,current='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    if(char==='"'||char==="'"||char==='`'){
      var quoteChar=char;current+=char;i++;
      while(i<text.length){
        if(text[i]==='\\'){current+=text[i]+(text[i+1]||'');i+=2;continue;}
        current+=text[i]; if(text[i]===quoteChar)break; i++;
      }
      continue;
    }
    if(char==='('||char==='['||char==='{')depth++;
    else if(char===')'||char===']'||char==='}')depth--;
    if(char===';'&&depth===0){parts.push(current);current='';continue;}
    current+=char;
  }
  parts.push(current);
  return parts;
}
function isIdent(char){return char!==undefined&&/[A-Za-z0-9_$]/.test(char);}

function instrument(src){
  var output='',pos=0,srcLength=src.length;
  while(pos<srcLength){
    var char=src[pos];
    if(char==='"'||char==="'"||char==='`'){
      var quoteChar=char;output+=char;pos++;
      while(pos<srcLength){
        if(src[pos]==='\\'){output+=src[pos]+(src[pos+1]||'');pos+=2;continue;}
        output+=src[pos]; if(src[pos]===quoteChar){pos++;break;} pos++;
      }
      continue;
    }
    if(char==='/'&&src[pos+1]==='/'){while(pos<srcLength&&src[pos]!=='\n')output+=src[pos++];continue;}
    if(char==='/'&&src[pos+1]==='*'){
      output+='/*';pos+=2;
      while(pos<srcLength&&!(src[pos]==='*'&&src[pos+1]==='/'))output+=src[pos++];
      output+='*/';pos+=2;continue;
    }
    if((char==='w'||char==='f')&&!isIdent(src[pos-1])){
      var keyword = src.substr(pos,5)==='while' ? 'while' : (src.substr(pos,3)==='for' ? 'for' : null);
      if(keyword && !isIdent(src[pos+keyword.length])){
        var afterKeyword=pos+keyword.length;
        while(afterKeyword<srcLength&&/\s/.test(src[afterKeyword]))afterKeyword++;
        if(src[afterKeyword]==='('){
          var parenDepth=0,scanPos=afterKeyword;
          for(;scanPos<srcLength;scanPos++){
            var innerChar=src[scanPos];
            if(innerChar==='"'||innerChar==="'"||innerChar==='`'){
              var innerQuoteChar=innerChar;scanPos++;
              while(scanPos<srcLength){ if(src[scanPos]==='\\'){scanPos+=2;continue;} if(src[scanPos]===innerQuoteChar)break; scanPos++; }
              continue;
            }
            if(innerChar==='(')parenDepth++;
            else if(innerChar===')'){parenDepth--; if(parenDepth===0)break;}
          }
          var innerCode=src.slice(afterKeyword+1,scanPos), rewrittenCondition=null;
          if(keyword==='while'){ rewrittenCondition='__tick() && ('+innerCode+')'; }
          else{
            var conditionParts=splitTop(innerCode);
            if(conditionParts.length===3){
              var middlePart=conditionParts[1].trim();
              conditionParts[1]= middlePart==='' ? ' __tick() ' : ' __tick() && ('+middlePart+')';
              rewrittenCondition=conditionParts.join(';');
            }
          }
          if(rewrittenCondition!==null){
            output+=keyword+src.slice(pos+keyword.length,afterKeyword)+'('+rewrittenCondition+')';
            pos=scanPos+1; continue;
          }
        }
      }
    }
    output+=char;pos++;
  }
  return output;
}

// Strip comments, keep strings. Everything a check() inspects goes through this.
function stripComments(src){
  var output='',pos=0,srcLength=src.length;
  while(pos<srcLength){
    var char=src[pos];
    if(char==='"'||char==="'"||char==='`'){
      var quoteChar=char;output+=char;pos++;
      while(pos<srcLength){
        if(src[pos]==='\\'){output+=src[pos]+(src[pos+1]||'');pos+=2;continue;}
        output+=src[pos]; if(src[pos]===quoteChar){pos++;break;} pos++;
      }
      continue;
    }
    if(char==='/'&&src[pos+1]==='/'){ while(pos<srcLength&&src[pos]!=='\n')pos++; continue; }
    if(char==='/'&&src[pos+1]==='*'){
      pos+=2;
      while(pos<srcLength&&!(src[pos]==='*'&&src[pos+1]==='/'))pos++;
      pos+=2; continue;
    }
    output+=char;pos++;
  }
  return output;
}

// Also blank out string CONTENTS, for checks that count real statements.
function stripStrings(src){
  return stripComments(src).replace(/"[^"\n]*"|'[^'\n]*'|`[^`\n]*`/g,'""');
}

var MAX_TICKS=120000, MAX_MS=1500;
function makeTick(){
  var ticks=0, deadline=Date.now()+MAX_MS;
  return function(){
    if(++ticks>MAX_TICKS){var countError=new Error('LOOP_GUARD_COUNT');countError.__guard=true;throw countError;}
    if((ticks&2047)===0&&Date.now()>deadline){var timeError=new Error('LOOP_GUARD_TIME');timeError.__guard=true;throw timeError;}
    return true;
  };
}
function formatValue(value){
  if(typeof value==='string')return value;
  if(value===undefined)return 'undefined';
  if(value===null)return 'null';
  if(typeof value==='number'||typeof value==='boolean')return String(value);
  if(typeof value==='function')return 'function '+(value.name||'(anonymous)');
  try{return JSON.stringify(value);}catch(e){return String(value);}
}
function friendly(error){
  if(error&&error.__guard){
    return error.message==='LOOP_GUARD_TIME'
      ? 'Your loop is still going after '+(MAX_MS/1000)+' seconds. Something in the condition never becomes false.'
      : 'Your loop ran '+MAX_TICKS.toLocaleString('en-US')+' times and never stopped. Check that the thing your condition tests actually changes inside the loop.';
  }
  var message=String((error&&error.message)||error);
  if(error instanceof ReferenceError){
    var match=message.match(/^(\w+) is not defined/);
    if(match)return 'JavaScript has never heard of "'+match[1]+'". Check the spelling, or create it first with let or const.';
  }
  if(error instanceof SyntaxError)return 'JavaScript cannot read this code: '+message+'. Look for a missing bracket, brace or quote.';
  if(error instanceof TypeError)return message+' — usually this means a value is not the kind of thing you tried to use it as.';
  return (error&&error.name?error.name+': ':'')+message;
}
function runCode(src){
  var logs=[];
  function push(args){ if(logs.length<400) logs.push(Array.prototype.map.call(args,formatValue).join(' ')); }
  var consoleShim={log:function(){push(arguments);},info:function(){push(arguments);},
            warn:function(){push(arguments);},error:function(){push(arguments);}};
  var runError=null;
  try{
    var sandboxedFunction=new Function('console','__tick','"use strict";\n'+instrument(src));
    sandboxedFunction(consoleShim,makeTick());
  }catch(caughtError){ runError=friendly(caughtError); }
  return {logs:logs,err:runError};
}

/* =====================================================================
   2. CONTENT — zones, stages, assertions
   Every stage past Zone 0 carries `reinforces`: the spiral is enforced
   in the data, not left to hope.
   ===================================================================== */
var ZONES=[
  {
    id:0, name:'Signals', color:'var(--z0)',
    blurb:'Making the machine say something back, and keeping a value so you can use it twice.',
    teaches:['console.log','let / const','`${...}`'],
    stages:[
      {
        id:'z0-say-something', kind:'learn', title:'Say something',
        brief:'<p>A program that says nothing is a program you cannot debug. <code>console.log</code> is how JavaScript talks back to you — and it is the single tool you will use most while learning.</p><p>Everything inside the brackets gets printed. Text goes in quotes; numbers do not.</p>',
        code:'console.log("Platform 9");\nconsole.log(94);\nconsole.log("Delay:", 4, "minutes");',
        codeNote:'Three lines in, three lines out. Commas print side by side with a space between.'
      },
      {
        id:'z0-plus-does-two-jobs', kind:'mcq', title:'Plus does two jobs',
        brief:'<p>The <code>+</code> symbol behaves differently depending on what sits either side of it. Read the code and decide what lands on the board.</p>',
        code:'let stops = 3;\nconsole.log("Stops: " + stops);\nconsole.log(stops + 1);',
        question:'What gets printed, in order?',
        options:['Stops: 3\n4','Stops: 3\n31','Stops: 4\n4','Stops: 3\nthen an error'],
        answer:0,
        explain:'With text on one side, + glues things together, so "Stops: " + 3 becomes "Stops: 3". With numbers on both sides it adds, so 3 + 1 is 4. Same symbol, two jobs — this trips up almost everyone once.',
        nudge:'Look at what is sitting on the LEFT of each + sign. Is it text in quotes, or a bare number?',
        example:{
          code:'console.log("Score: " + 7);   // Score: 7\nconsole.log(7 + 3);            // 10',
          note:'Different words, same rule: quotes on one side means glue, numbers on both sides means add.'
        }
      },
      {
        id:'z0-backticks-or-quotes', kind:'mcq', title:'Backticks or quotes?',
        brief:'<p>Two lines that look almost identical. One character at each end is the whole difference — and both write stages ahead of you depend on knowing which is which.</p>',
        code:'const stop = "Central";\n\nconsole.log("Next: ${stop}");\nconsole.log(`Next: ${stop}`);',
        question:'What lands on the board, in order?',
        options:['Next: ${stop}\nNext: Central','Next: Central\nNext: Central','Next: Central\nNext: ${stop}','an error on the first line'],
        answer:0,
        explain:'${...} only means something inside BACKTICKS. In ordinary quotes it is just five characters, printed exactly as typed — no error, no warning, just the wrong text. The second line uses backticks, so the value drops in. When a name comes out as ${name} on the board, this is always why.',
        nudge:'Look at the character at each end of the two strings. One pair is ordinary quotes; the other is something else. Which of the two knows what ${...} means?',
        example:{
          code:'const city = "Perth";\n\nconsole.log("in ${city}");   // in ${city}\nconsole.log(`in ${city}`);   // in Perth',
          note:'Same slot, two containers. Only the backticks fill it in.'
        },
        reinforces:['const','console.log']
      },
      {
        id:'z0-keep-it-in-a-box', kind:'write', title:'Keep it in a box',
        brief:'<p>A variable is a labelled box. You put a value in once and use the label everywhere after.</p><p>Instead of gluing text with <code>+</code>, you can use a <strong>template literal</strong>: backticks around the text, and <code>${...}</code> wherever a value should slot in.</p>',
        task:'Create a variable called <code>name</code> holding your name, then print exactly:<br><code>Hi, {{name}}! Ready to roll.</code>',
        starter:'// Put your name in a box called `name`\n\n\n// Then print the greeting\n',
        nudge:'This needs two lines. One makes the box and puts your name in it. One prints a sentence with the box slotted in. Which of the two have you got so far?',
        example:{
          code:'const city = "Adelaide";\nconsole.log(`Welcome to ${city}.`);\n\n// prints:  Welcome to Adelaide.',
          note:'Backticks, not quotes. The ${...} is a hole the value drops into.'
        },
        hint:'const name = "{{name}}";  then  console.log(`Hi, ${name}! Ready to roll.`);',
        solution:'const name = "{{name}}";\nconsole.log(`Hi, ${name}! Ready to roll.`);',
        reinforces:['console.log'],
        check:function(out,src){
          if(out.length===0)return{ok:false,msg:'Nothing reached the board. Did you call console.log?'};
          if(out.length>1)return{ok:false,msg:'The board shows '+out.length+' lines but this task wants exactly one.'};
          if(!/^Hi, .+! Ready to roll\.$/.test(out[0]))return{ok:false,msg:'Close. The line has to read exactly "Hi, SOMETHING! Ready to roll." — check the comma, the exclamation mark and the full stop.'};
          if(!/\b(let|const|var)\s+name\b/.test(src))return{ok:false,msg:'The output is right, but the name is not in a variable yet. Create one called name and use it.'};
          return{ok:true,msg:'That is a variable, a template literal and a print in three lines. This shape shows up in every stage from here on.'};
        }
      },
      {
        id:'z0-two-boxes-one-sentence', kind:'write', title:'Two boxes, one sentence',
        brief:'<p>One more rep, with two boxes instead of one. A template literal takes as many <code>${...}</code> slots as you need.</p><p>Watch the dollar signs in the answer — a literal <code>$</code> for money sits right next to the <code>${...}</code> of a slot. They are different things that happen to look alike.</p>',
        task:'Both variables are already there. Print exactly:<br><code>A flat white costs $5.</code>',
        starter:'const drink = "flat white";\nconst price = 5;\n\n// print:  A flat white costs $5.\n',
        nudge:'The sentence has two holes in it — one for the drink, one for the price. Build the sentence once and drop both boxes into it.',
        example:{
          code:'const city = "Adelaide";\nconst temp = 21;\n\nconsole.log(`${city} is ${temp} degrees today.`);\n\n// Adelaide is 21 degrees today.',
          note:'Two slots in one sentence. Change either box and the sentence updates itself.'
        },
        hint:'console.log(`A ${drink} costs $${price}.`);',
        solution:'const drink = "flat white";\nconst price = 5;\n\nconsole.log(`A ${drink} costs $${price}.`);',
        reinforces:['const','console.log','template literals'],
        check:function(out,src){
          if(out.length!==1)return{ok:false,msg:'Expected exactly one line, got '+out.length+'.'};
          // Read drink and price back out of the student's own code, rather than
          // assuming the starter's values — the hint below invites changing
          // price and running again, and the check has to follow that change,
          // not flag a now-correct answer as wrong.
          var mPrice=src.match(/\bprice\s*=\s*(\d+)/);
          var mDrink=src.match(/\bdrink\s*=\s*["'`]([^"'`]*)["'`]/);
          var price=mPrice?mPrice[1]:'5';
          var drink=mDrink?mDrink[1]:'flat white';
          var want='A '+drink+' costs $'+price+'.';
          if(out[0]!==want)return{ok:false,msg:'The board reads "'+out[0]+'" but it should read "'+want+'" — check the dollar sign and the full stop.'};
          if(!/\$\{\s*drink\s*\}/.test(src)||!/\$\{\s*price\s*\}/.test(src))return{ok:false,msg:'Right words, but the drink and the price look typed into the sentence. Use the two boxes — ${drink} and ${price} — so changing them changes the sentence.'};
          return{ok:true,msg:'Two boxes, one sentence. Change price to 6 and run it again — you only touch the box, never the sentence.'};
        }
      }
    ]
  },
  {
    id:1, name:'Junctions', color:'var(--z1)',
    blurb:'Code that takes one path or another. Nothing later works without this.',
    teaches:['if / else','===  >  <','else if'],
    stages:[
      {
        id:'z1-choosing-a-track', kind:'learn', title:'Choosing a track',
        brief:'<p>A comparison such as <code>speed &gt; 60</code> is not a number — it answers <strong>true</strong> or <strong>false</strong>. <code>if</code> runs its block only when the answer is true.</p><p>Note <code>===</code> for "is equal to". A single <code>=</code> means "put this value in the box", which is a different thing entirely.</p>',
        code:'const speed = 72;\n\nif (speed > 60) {\n  console.log("Too fast");\n} else {\n  console.log("Fine");\n}',
        codeNote:'Only one of the two blocks ever runs. Never both.',
        reinforces:['const','console.log']
      },
      {
        id:'z1-first-true-wins', kind:'mcq', title:'First true wins',
        brief:'<p>You can chain conditions with <code>else if</code>. JavaScript checks them top to bottom and <strong>stops at the first true one</strong>.</p>',
        code:'const speed = 40;\n\nif (speed > 60) {\n  console.log("Too fast");\n} else if (speed > 30) {\n  console.log("Cruising");\n} else {\n  console.log("Crawling");\n}',
        question:'What lands on the board?',
        options:['Cruising','Too fast','Crawling','Cruising\nCrawling'],
        answer:0,
        explain:'40 is not more than 60, so the first block is skipped. 40 IS more than 30, so "Cruising" prints — and the chain stops there. The else never gets a look in.',
        nudge:'Work down the chain one line at a time. Is 40 more than 60? No. Is 40 more than 30? Now — does anything after that even get checked?',
        example:{
          code:'const score = 55;\n\nif (score > 90) {\n  console.log("A");\n} else if (score > 50) {\n  console.log("B");\n} else {\n  console.log("C");\n}\n\n// prints:  B',
          note:'55 beats 50 but not 90, so the middle branch wins and the chain stops. C never gets a look in.'
        },
        reinforces:['const','console.log']
      },
      {
        id:'z1-on-the-line-or-over-it', kind:'mcq', title:'On the line, or over it?',
        brief:'<p>Three comparisons, one value. The boundary is where nearly every wrong answer in the next two stages will come from, so settle it here.</p>',
        code:'const speed = 50;\n\nif (speed === 50) { console.log("exactly fifty"); }\nif (speed >= 50) { console.log("fifty or more"); }\nif (speed > 50)  { console.log("more than fifty"); }',
        question:'What lands on the board?',
        options:['exactly fifty\nfifty or more','all three lines','exactly fifty','fifty or more\nmore than fifty'],
        answer:0,
        explain:'These are three separate ifs, not a chain, so each one is checked. 50 is exactly 50, and 50 is fifty-or-more — but 50 is NOT more than 50. That last one is the boundary: >= includes the number itself, > excludes it. Choosing the wrong one is an off-by-one bug that looks right until someone hits the exact value.',
        nudge:'Take them one at a time and answer yes or no for 50. The third is the interesting one: is fifty more than fifty?',
        example:{
          code:'const age = 18;\n\nif (age > 18)  { console.log("over 18"); }\nif (age >= 18) { console.log("18 or over"); }\n\n// 18 or over',
          note:'Exactly on the boundary, > says no and >= says yes. "18 and over" in plain English means >=.'
        },
        reinforces:['const','if / else','console.log']
      },
      {
        id:'z1-the-age-gate', kind:'write', title:'The age gate',
        brief:'<p>Time to put the box and the branch together — this is the first stage that needs two zones at once.</p>',
        task:'Create a variable <code>age</code> set to <code>15</code>. If it is less than 18, print <code>Minor</code>. Otherwise print <code>Adult</code>.',
        starter:'const age = 15;\n\n// if age is under 18, print "Minor"\n// otherwise print "Adult"\n',
        nudge:'Two things to get right: the test in the brackets, and a second branch for when the test is false. Have you written the else part yet?',
        example:{
          code:'const temp = 35;\n\nif (temp > 30) {\n  console.log("Hot");\n} else {\n  console.log("Mild");\n}\n\n// prints:  Hot',
          note:'Same skeleton, different subject. Swap the test and the two messages and you have this stage.'
        },
        hint:'if (age < 18) { console.log("Minor"); } else { console.log("Adult"); }',
        solution:'const age = 15;\n\nif (age < 18) {\n  console.log("Minor");\n} else {\n  console.log("Adult");\n}',
        reinforces:['const','console.log','if / else'],
        check:function(out,src){
          if(!/\bif\b/.test(src))return{ok:false,msg:'This one needs an if statement — printing "Minor" directly does not count.'};
          if(!/\belse\b/.test(src))return{ok:false,msg:'There is no else branch yet. Add one so the code still works no matter what age is set to.'};
          if(out.length!==1)return{ok:false,msg:'Expected exactly one line on the board, got '+out.length+'. Only one branch should run.'};
          // Read age back out of the student's own code rather than assuming 15 —
          // the message below invites changing it to 30 and running again, and
          // the check has to follow that change, not flag a correct answer as wrong.
          var m=src.match(/\bage\s*=\s*(-?\d+)/);
          var age=m?parseInt(m[1],10):15;
          var want=age<18?'Minor':'Adult';
          if(out[0]!==want)return{ok:false,msg:'The board says "'+out[0]+'", but with age set to '+age+' it should say "'+want+'".'};
          return{ok:true,msg:'Change age to 30 and hit Run again — the other branch takes over and you never touched the print lines. That is the point of a branch.'};
        }
      },
      {
        id:'z1-three-ways-out', kind:'write', title:'Three ways out',
        brief:'<p>Two branches were the warm-up. Three is where order starts to matter: JavaScript stops at the first true test, so a badly ordered chain gives the right answer to the wrong person.</p>',
        task:'Using the <code>score</code> below, print <code>A</code> for 85 or more, <code>B</code> for 70 or more, and <code>C</code> for anything else. With score at 72 the board should read <code>B</code>.',
        starter:'const score = 72;\n\n// A for 85+, B for 70+, C otherwise\n',
        nudge:'Three outcomes need three branches. Think about order: if you test for 70 first, what happens to a score of 90?',
        example:{
          code:'const rain = 12;\n\nif (rain > 50) {\n  console.log("Flood watch");\n} else if (rain > 10) {\n  console.log("Heavy");\n} else {\n  console.log("Light");\n}\n\n// prints:  Heavy',
          note:'Biggest test first, then the middle one, then a plain else to catch everything left. Flip the first two and 60mm of rain would report as "Heavy".'
        },
        hint:'if (score >= 85) { ... } else if (score >= 70) { ... } else { ... }',
        solution:'const score = 72;\n\nif (score >= 85) {\n  console.log("A");\n} else if (score >= 70) {\n  console.log("B");\n} else {\n  console.log("C");\n}',
        reinforces:['const','console.log','if / else'],
        check:function(out,src){
          if(!/else\s+if/.test(src))return{ok:false,msg:'Three outcomes need an else if in the middle. Two separate if statements will work today but fall apart as soon as the numbers change.'};
          if(out.length!==1)return{ok:false,msg:'Expected one line, got '+out.length+'. Only one branch of a chain should ever run.'};
          if(out[0]!=='B')return{ok:false,msg:'The board says "'+out[0]+'" but 72 should score a B. '+(out[0]==='A'?'Check the order — is the 85 test running before the 70 test?':'Check the comparison: is it 70 or more, or strictly more than 70?')};
          return{ok:true,msg:'Now change score to 90, then to 40, and run each time. One chain, three answers, no new code.'};
        }
      }
    ]
  },
  {
    id:2, name:'Sidings', color:'var(--z2)',
    blurb:'One box holding many values, in order. The thing loops were invented for.',
    teaches:['[ ]','index','.length','stops[i] = ...'],
    stages:[
      {
        id:'z2-a-row-of-boxes', kind:'learn', title:'A row of boxes',
        brief:'<p>An <strong>array</strong> is one variable holding a list, in order. You reach an item by its position — and positions start at <strong>0</strong>, not 1. This is the single most common off-by-one bug in programming, so it is worth staring at.</p>',
        code:'const stops = ["Central", "Riverside", "Hillcrest"];\n\nconsole.log(stops[0]);       // Central\nconsole.log(stops[2]);       // Hillcrest\nconsole.log(stops.length);   // 3',
        codeNote:'Three items, so .length is 3 — but the last index is 2. Last item is always stops[stops.length - 1].',
        reinforces:['const','console.log']
      },
      {
        id:'z2-off-by-one', kind:'mcq', title:'Off by one',
        brief:'<p>Before you write anything with arrays, get the counting straight. <code>.length</code> and the last index are never the same number.</p>',
        code:'const stops = ["Central", "Riverside", "Hillcrest"];\n\nconsole.log(stops.length);\nconsole.log(stops[stops.length - 1]);\nconsole.log(stops[3]);',

        id:'z3-where-the-counter-lives', kind:'mcq', title:'Where the counter lives',
        brief:'<p>One line, in the wrong place. This is the exact trap the interchange is built on, so it is worth getting wrong here where it costs you nothing.</p>',
        code:'for (let i = 0; i < 3; i++) {\n  let seen = 0;\n  seen++;\n  console.log(seen);\n}',
        question:'What lands on the board?',
        options:['1\n1\n1','1\n2\n3','3','0\n1\n2'],
        answer:0,
        explain:'let seen = 0 sits INSIDE the loop, so it is built fresh at the top of every pass and thrown away at the bottom. The ++ always starts from 0, so it always reaches 1. Move that one line above the loop and the board reads 1, 2, 3 — which is what a running total needs. Same three lines of code; the position of one of them is the whole difference.',
        nudge:'Read the lines in the order they actually run. On the second pass, what is seen just before the ++ happens — and which line set it to that?',
        example:{
          code:'for (let i = 0; i < 2; i++) {\n  let n = 10;\n  n++;\n  console.log(n);\n}\n\n// 11\n// 11',
          note:'let n = 10 runs again at the top of every pass, so the ++ always starts from 10. A variable declared inside a loop cannot remember anything between passes.'
        },
        reinforces:['for','let','i++']
      },
      {
        id:'z3-interchange-the-delay-board', kind:'boss', title:'Interchange: the delay board',
        brief:'<p>An interchange: four zones meet here, and both halves are already yours.</p><ul><li>the <code>if</code> inside the loop — from <em>Only the late ones</em></li><li>a counter that lives <strong>above</strong> the loop — from <em>Where the counter lives</em></li></ul><p>The only new thing is doing both at once, in one loop body: print the delay <em>and</em> add one to the tally.</p>',
        task:'Loop over <code>delays</code>. For every delay <strong>over 10</strong>, print a line like <code>Delay: 14 min</code>. Skip the rest entirely. Then print one final line: <code>3 services delayed</code> — counted by the code, not typed by you.',
        starter:'const delays = [2, 14, 0, 23, 7, 31];\n\n// print each delay over 10, then the total count\n',
        nudge:'Three jobs here: walk the list, decide which ones print, keep a tally. The tally is the tricky one — if you create it inside the loop it resets every pass. Where does it have to live instead?',
        example:{
          code:'let passes = 0;          // born BEFORE the loop\n\nfor (let i = 0; i < scores.length; i++) {\n  if (scores[i] >= 50) {\n    passes++;            // grows INSIDE the if\n  }\n}\n\nconsole.log(passes);     // read AFTER the loop ends',
          note:'Just the counter part, on its own. Move that first line inside the loop and it resets to 0 every pass — which is the mistake this stage is really about. The printing is yours to add.'
        },
        hint:'Make a counter before the loop: let count = 0;  Inside the if, print the line and do count++;  After the loop, print `${count} services delayed`.',
        solution:'const delays = [2, 14, 0, 23, 7, 31];\nlet count = 0;\n\nfor (let i = 0; i < delays.length; i++) {\n  if (delays[i] > 10) {\n    console.log(`Delay: ${delays[i]} min`);\n    count++;\n  }\n}\n\nconsole.log(`${count} services delayed`);',
        reinforces:['let','arrays','.length','for','index','if','template literals'],
        check:function(out,src){
          if(!/\bfor\b|\bwhile\b/.test(src))return{ok:false,msg:'The boss needs a loop — it should still work if the delays array had 60 numbers in it.'};
          if(!/\bif\b/.test(src))return{ok:false,msg:'There is no if in here. Something has to decide which delays are worth printing.'};
          var want=['Delay: 14 min','Delay: 23 min','Delay: 31 min','3 services delayed'];

          // Name what is MISSING, not just the line count. The commonest near-miss
          // by far: the tally is right but the delays themselves were never printed.
          if(out.length===1 && /services delayed$/.test(out[0])){
            return{ok:false,msg:'The tally is there and "'+out[0]+'" is the right total — so the loop and the if are both working. What is missing is the delays themselves. Add a console.log for the delay inside the if, on the line above count++.'};
          }
          if(out.length===3 && /^Delay: /.test(out[0])){
            return{ok:false,msg:'The three delays are exactly right — only the final tally line is missing. Count them with a variable as you go, then print `${count} services delayed` after the loop has finished.'};
          }
          if(out.length===7){
            return{ok:false,msg:'Seven lines: every delay printed, plus the total. The print is inside the loop but outside the if — move it into the if’s braces so only the ones over 10 get through.'};
          }
          if(out.length!==4)return{ok:false,msg:'Expected 4 lines — the 3 delays over 10, then the total — but got '+out.length+'.'};

          for(var i=0;i<4;i++) if(out[i]!==want[i])
            return{ok:false,msg:'Line '+(i+1)+' reads "'+out[i]+'" but should read "'+want[i]+'".'+(i===3?' The count has to be worked out by the code — declare it before the loop and add one each time you print.':'')};
          if(/console\.log\(\s*["'`]3 services/.test(src))return{ok:false,msg:'The last line is typed by hand. Count with a variable so it stays right when the delays change.'};
          var note = /(>|!)=\s*10\b/.test(src)
            ? ' One thing worth knowing: you tested >= 10, which also lets a delay of exactly 10 through. This data has none, so it passes — but "over 10" means > 10.'
            : '';
          return{ok:true,msg:'Loop, branch, counter, template literal — all four working together. That is the shape of most useful code you will ever write.'+note};
        }
      }
    ]
  },
  {
    id:4, name:'Depots', color:'var(--z4)',
    blurb:'Wrapping code in a name so you can send for it later.',
    teaches:['function','parameters','return','calling'],
    stages:[
      {
        id:'z4-naming-a-piece-of-code', kind:'learn', title:'Naming a piece of code',
        brief:'<p>Everything so far has run top to bottom, once. A <strong>function</strong> lets you write a block of code once and run it on command, as many times as you like.</p><ul><li><strong>Declare</strong> it — <code>function announce() { ... }</code> — and nothing happens yet</li><li><strong>Call</strong> it — <code>announce();</code> — and the code inside the braces runs</li></ul><p>Declaring is writing the recipe. Calling is cooking it.</p>',
        code:'function announce() {\n  console.log("The next train is now boarding.");\n}\n\nannounce();\nannounce();\n\n// The next train is now boarding.\n// The next train is now boarding.',
        codeNote:'Writing function announce() {...} does not run anything by itself — it just gives that block of code a name. Nothing happens until announce() is actually called. Call it twice and the whole block runs twice.',
        reinforces:['console.log']
      },
      {
        id:'z4-only-runs-when-called', kind:'mcq', title:'Only runs when called',
        brief:'<p>A function\'s body does not run where it is <em>written</em> — it runs at the exact line where it is <em>called</em>. Reading order still matters, just not the way you might expect.</p>',
        code:'function sayHi() {\n  console.log("Hi there!");\n}\n\nconsole.log("Start");\nsayHi();\nconsole.log("End");',
        question:'What lands on the board?',
        options:['Start\nHi there!\nEnd','Hi there!\nStart\nEnd','Start\nEnd','Hi there!'],
        answer:0,
        explain:'Defining sayHi prints nothing on its own — it just sets the function aside for later. The three lines below it run top to bottom: "Start" prints first, then sayHi() is called so its body runs ("Hi there!"), then "End" prints last.',
        nudge:'The function\'s own console.log only fires at the exact line where sayHi() is written and called — not up where it was defined. Find that line and count from there.',
        example:{
          code:'function bark() {\n  console.log("Woof!");\n}\n\nconsole.log("before");\nbark();\nconsole.log("after");\n\n// before\n// Woof!\n// after',
          note:'The function\'s body only runs at the exact spot bark() is called — same rule as sayHi.'
        },
        reinforces:['console.log']
      },
      {
        id:'z4-same-function-different-input', kind:'mcq', title:'Same function, different input',
        brief:'<p>A function that always prints the exact same thing is not very useful. A <strong>parameter</strong> is a placeholder in the parentheses that gets filled in fresh every time the function is called.</p>',
        code:'function announceStop(name) {\n  console.log(`Now arriving: ${name}`);\n}\n\nannounceStop("Central");\nannounceStop("Riverside");',
        question:'What lands on the board?',
        options:['Now arriving: Central\nNow arriving: Riverside','Now arriving: name\nNow arriving: name','Now arriving: Central','Central\nRiverside'],
        answer:0,
        explain:'name is a parameter — a placeholder that gets filled in with whatever is passed when the function is called. The first call fills it with "Central", the second with "Riverside". Same function, same code, two different outputs because the input changed.',
        nudge:'name is not a literal word being printed — it is a stand-in. What gets poured into that stand-in on each call?',
        example:{
          code:'function greet(person) {\n  console.log(`Hello, ${person}!`);\n}\n\ngreet("Sam");\ngreet("Alex");\n\n// Hello, Sam!\n// Hello, Alex!',
          note:'person is filled in fresh on every call — the function body itself never changes.'
        },
        reinforces:['template literals','console.log']
      },
      {
        id:'z4-announce-the-delay', kind:'write', title:'Announce the delay',
        brief:'<p>Your turn — one parameter, one line printed using it.</p>',
        task:'Write a function called <code>announceDelay</code> that takes one parameter, <code>minutes</code>, and prints <code>Delay: 7 minutes</code>. Call it once, passing <code>7</code>.',
        starter:'// function announceDelay(minutes) { ... }\n\n',
        nudge:'The parameter goes inside the parentheses when you write the function: function announceDelay(minutes) {. Inside, use a template literal so minutes fills in the number.',
        example:{
          code:'function announceFare(amount) {\n  console.log(`Fare: $${amount}`);\n}\n\nannounceFare(5);\n\n// Fare: $5',
          note:'Same shape — one parameter, one template literal using it, one call.'
        },
        hint:'function announceDelay(minutes) { console.log(`Delay: ${minutes} minutes`); }\n\nannounceDelay(7);',
        solution:'function announceDelay(minutes) {\n  console.log(`Delay: ${minutes} minutes`);\n}\n\nannounceDelay(7);',
        reinforces:['template literals','console.log'],
        check:function(out,src){
          if(!/\bfunction\b/.test(src))return{ok:false,msg:'There is no function here — write one called announceDelay that takes a parameter.'};
          if(!/function\s+\w+\s*\(\s*\w+/.test(src))return{ok:false,msg:'The function needs a parameter in its parentheses — that is what makes minutes changeable instead of fixed.'};
          if(/Delay: 7 minutes/.test(src) && !/\$\{/.test(src))return{ok:false,msg:'That prints a fixed sentence — it would still say 7 even if you called the function with a different number. Use the parameter inside a template literal instead.'};
          if(out.length!==1)return{ok:false,msg:'Expected exactly 1 line, got '+out.length+'. Call the function once.'};
          if(out[0]!=='Delay: 7 minutes')return{ok:false,msg:'Got "'+out[0]+'" but expected "Delay: 7 minutes". Check the parameter is actually being used inside the template literal.'};
          return{ok:true,msg:'A function with a parameter — same code, a different number every time you call it with something new.'};
        }
      },
      {
        id:'z4-handing-a-value-back', kind:'learn', title:'Handing a value back',
        brief:'<p>Printing from inside a function and <strong>returning</strong> a value are different things. <code>return</code> sends a value back to wherever the function was called — so it can be stored, printed, or reused — but only if the caller does something with it.</p>',
        code:'function double(n) {\n  return n * 2;\n}\n\nconst result = double(4);\nconsole.log(result);\n\n// 8',
        codeNote:'return does not print anything by itself. double(4) becomes the value 8, which then gets stored in result — and it is that console.log on the next line, not the function, that puts 8 on the board.',
        reinforces:['const','console.log']
      },
      {
        id:'z4-printed-or-handed-back', kind:'mcq', title:'Printed, or handed back?',
        brief:'<p>Watch closely: one line below comes from inside the function, and the other from a value it handed back. They are not the same thing.</p>',
        code:'function shout(word) {\n  console.log(word.toUpperCase());\n}\n\nconst result = shout("go");\nconsole.log(result);',
        question:'What lands on the board?',
        options:['GO\nundefined','GO\nGO','undefined\nGO','GO'],
        answer:0,
        explain:'shout prints "GO" itself, using a console.log inside its own body — that happens the moment it is called. But shout never uses return, so the value handed back to result is undefined, the default for any function that does not explicitly return something. Printing something and returning something are two different jobs.',
        nudge:'shout has a console.log inside it — that is one line of output. But does it have a return anywhere? What does a function hand back if it never says return?',
        example:{
          code:'function whisper(word) {\n  console.log(word.toLowerCase());\n}\n\nconst r = whisper("HI");\nconsole.log(r);\n\n// hi\n// undefined',
          note:'whisper prints its own line, but returns nothing — so r ends up undefined, same story as shout.'
        },
        reinforces:['const','console.log']
      },
      {
        id:'z4-double-the-fare', kind:'write', title:'Double the fare',
        brief:'<p>Your turn — compute inside the function, hand it back with return, then use it outside.</p>',
        task:'Write a function called <code>double</code> that takes one parameter, <code>amount</code>, and <strong>returns</strong> twice that number — no console.log inside the function itself. Then call <code>double(4)</code>, store what it returns in a variable, and print that variable.',
        starter:'// function double(amount) { ... }\n\n',
        nudge:'Inside the function: return amount * 2; — no console.log needed in there at all. Store what double(4) hands back in a variable, then print that variable.',
        example:{
          code:'function triple(n) {\n  return n * 3;\n}\n\nconst result = triple(5);\nconsole.log(result);\n\n// 15',
          note:'The function only computes and returns — the printing happens outside, on the value it handed back.'
        },
        hint:'function double(amount) { return amount * 2; }\n\nconst result = double(4);\nconsole.log(result);',
        solution:'function double(amount) {\n  return amount * 2;\n}\n\nconst result = double(4);\nconsole.log(result);',
        reinforces:['const','console.log'],
        check:function(out,src){
          var s=stripStrings(src);
          var m=s.match(/function\s+double\s*\([^)]*\)\s*\{([\s\S]*?)\}/);
          if(!m)return{ok:false,msg:'There is no function called double here — write one that takes a parameter and returns a value.'};
          if(/console\.log/.test(m[1]))return{ok:false,msg:'double has a console.log inside it — the task asks for return instead, so the number can be used outside the function, not just printed from inside it.'};
          if(!/\breturn\b/.test(m[1]))return{ok:false,msg:'double never returns anything — add return amount * 2; inside it.'};
          if(out.length!==1)return{ok:false,msg:'Expected exactly 1 line, got '+out.length+'.'};
          if(out[0]!=='8')return{ok:false,msg:'Got "'+out[0]+'" but expected "8" — double(4) should hand back 4 * 2.'};
          return{ok:true,msg:'return hands the value back to wherever double was called — that is what let the outside console.log use it.'};
        }
      },
      {
        id:'z4-interchange-the-fare-desk', kind:'boss', title:'Interchange: the fare desk',
        brief:'<p>An interchange: three things you already have, working together.</p><ul><li>a function that <strong>returns</strong> a value — from <em>Double the fare</em></li><li><code>if</code> / <code>else if</code> / <code>else</code> — from Junctions</li><li>a loop over an array — from The Long Haul</li></ul><p>The only new thing is calling the same function once per item in the loop.</p>',
        task:'Write a function <code>fareFor(minutes)</code> that returns <code>"$3"</code> when minutes is under 10, <code>"$5"</code> when under 20, and <code>"$8"</code> otherwise. Then loop over <code>trips</code> and print the fare for each one, one per line.',
        starter:'const trips = [6, 15, 25];\n\n// write fareFor(minutes) here\n\n// then loop over trips and print the fare for each\n',
        nudge:'Three jobs: a function that decides the price, an if / else if / else inside it, and a loop that calls the function once per trip. Build and test the function alone before wiring up the loop.',
        example:{
          code:'function gradeFor(score) {\n  if (score < 50) {\n    return "Fail";\n  } else if (score < 75) {\n    return "Pass";\n  } else {\n    return "Distinction";\n  }\n}\n\nconst scores = [40, 60, 90];\nfor (let i = 0; i < scores.length; i++) {\n  console.log(gradeFor(scores[i]));\n}\n\n// Fail\n// Pass\n// Distinction',
          note:'Same shape: a function with if / else if / else, each branch returning a value, called once per item in a loop.'
        },
        hint:'function fareFor(minutes) { if (minutes < 10) return "$3"; else if (minutes < 20) return "$5"; else return "$8"; }  Then: for (let i = 0; i < trips.length; i++) { console.log(fareFor(trips[i])); }',
        solution:'function fareFor(minutes) {\n  if (minutes < 10) {\n    return "$3";\n  } else if (minutes < 20) {\n    return "$5";\n  } else {\n    return "$8";\n  }\n}\n\nconst trips = [6, 15, 25];\nfor (let i = 0; i < trips.length; i++) {\n  console.log(fareFor(trips[i]));\n}',
        reinforces:['if / else','for','arrays','.length','index'],
        check:function(out,src){
          if(!/\bfunction\b/.test(src))return{ok:false,msg:'There is no function here — write fareFor(minutes) first.'};
          if(!/\breturn\b/.test(src))return{ok:false,msg:'fareFor needs to return the price, not just console.log it — the loop needs a value handed back so it can print it.'};
          if(!/\bif\b/.test(src))return{ok:false,msg:'There is no if in here. fareFor needs to choose between three prices depending on minutes.'};
          if(!/\bfor\b/.test(src))return{ok:false,msg:'The fares need a loop over trips — it should still work if trips had 60 numbers in it, not just 3.'};
          var want=['$3','$5','$8'];
          if(out.length===0)return{ok:false,msg:'Nothing printed. fareFor is defined but never called — loop over trips and print fareFor(trips[i]) for each one.'};
          if(out.indexOf('undefined')!==-1)return{ok:false,msg:'"undefined" showed up — that happens when a function falls through every branch without a return. Check that the final else has a return too.'};
          if(out.length!==3)return{ok:false,msg:'Expected 3 lines, one fare per trip, got '+out.length+'.'};
          for(var i=0;i<3;i++) if(out[i]!==want[i])
            return{ok:false,msg:'Trip '+(i+1)+' ('+([6,15,25][i])+' minutes) printed "'+out[i]+'" but should be "'+want[i]+'". Check the boundaries — under 10, under 20, and everything else.'};
          return{ok:true,msg:'A function that decides, a loop that reuses it three times, three different answers. That is what functions are for.'};
        }
      }
    ]
  },
  {
    id:5, name:'Manifests', color:'var(--z5)',
    blurb:'Values with labels, not just positions.',
    teaches:['objects','dot notation','arrays of objects'],
    stages:[
      {
        id:'z5-values-with-labels', kind:'learn', title:'Values with labels',
        brief:'<p>An <strong>object</strong> is a single value holding several labelled pieces, not positioned ones. <code>{ name: "Central", platform: 2 }</code> has two <strong>properties</strong> — name and platform.</p><p><strong>Dot notation</strong> — <code>stop.name</code> — reads the value stored under that label. No index, no counting, just the name of the thing you want.</p>',
        code:'const stop = { name: "Central", platform: 2 };\n\nconsole.log(stop.name);\nconsole.log(stop.platform);\n\n// Central\n// 2',
        codeNote:'stop.name and stop.platform read the two properties by their labels. Compare this to an array, where stops[0] reads by position — here there is no position at all, only names.',
        reinforces:['const','console.log']
      },
      {
        id:'z5-two-labels-one-object', kind:'mcq', title:'Two labels, one object',
        brief:'<p>Dot notation always reads the <strong>value</strong> stored at a label, never the label\'s own name.</p>',
        code:'const ticket = { passenger: "Jordan", price: 12 };\n\nconsole.log(`${ticket.passenger} paid $${ticket.price}`);',
        question:'What lands on the board?',
        options:['Jordan paid $12','passenger paid $price','ticket.passenger paid $ticket.price','$12 paid Jordan'],
        answer:0,
        explain:'ticket.passenger reads the value stored under the passenger label — "Jordan" — and ticket.price reads the value under price — 12. Both drop straight into the template literal like any other variable would.',
        nudge:'ticket.passenger is not printing the word "passenger" — it is reading whatever value is stored under that label. What is actually stored there?',
        example:{
          code:'const car = { make: "Toyota", year: 2019 };\n\nconsole.log(`${car.make} (${car.year})`);\n\n// Toyota (2019)',
          note:'Same trick — two labels on one object, both read out with dot notation inside a template literal.'
        },
        reinforces:['template literals','console.log']
      },
      {
        id:'z5-changing-a-labels-value', kind:'mcq', title:'Changing a label\'s value',
        brief:'<p>Dot notation can <strong>write</strong> as well as read. Even on a <code>const</code> object, a property can still change — it is the object itself that cannot be reassigned, not what is inside it.</p>',
        code:'const seat = { row: 12, booked: false };\n\nseat.booked = true;\n\nconsole.log(seat.booked);',
        question:'What lands on the board?',
        options:['true','false','booked','undefined'],
        answer:0,
        explain:'seat.booked = true; overwrites whatever was stored under that label — false becomes true. const only stops seat itself from being reassigned to a whole new object; the properties inside it are still free to change.',
        nudge:'There are two lines mentioning booked — one changes it, one reads it. Which runs first, and what does it leave behind for the second one to read?',
        example:{
          code:'const light = { color: "red" };\n\nlight.color = "green";\n\nconsole.log(light.color);\n\n// green',
          note:'Assigning with dot notation overwrites the old value on that one property — same idea as reassigning a plain variable, just aimed at a single label.'
        },
        reinforces:['const','console.log']
      },
      {
        id:'z5-write-your-first-manifest', kind:'write', title:'Write your first manifest',
        brief:'<p>Your turn — build one from scratch.</p>',
        task:'Create an object called <code>train</code> with two properties: <code>line</code> set to <code>"Express"</code>, and <code>carriages</code> set to <code>6</code>. Then print <code>Express has 6 carriages</code> using both properties in one template literal.',
        starter:'// const train = { ... };\n\n',
        nudge:'Object literals use curly braces: { line: "Express", carriages: 6 }. Read each property back with dot notation inside a template literal: `${train.line} has ${train.carriages} carriages`.',
        example:{
          code:'const bus = { route: "42", seats: 30 };\n\nconsole.log(`Route ${bus.route} has ${bus.seats} seats`);\n\n// Route 42 has 30 seats',
          note:'Same shape — an object with two properties, both read back with dot notation in one template literal.'
        },
        hint:'const train = { line: "Express", carriages: 6 };\n\nconsole.log(`${train.line} has ${train.carriages} carriages`);',
        solution:'const train = { line: "Express", carriages: 6 };\n\nconsole.log(`${train.line} has ${train.carriages} carriages`);',
        reinforces:['template literals','console.log'],
        check:function(out,src){
          if(!/\{\s*\w+\s*:/.test(src))return{ok:false,msg:'There is no object literal here — create one with curly braces, like { line: "Express", carriages: 6 }.'};
          if(!/\.\w+/.test(stripStrings(src)))return{ok:false,msg:'Nothing is read back with dot notation. Use train.line and train.carriages inside the template literal.'};
          if(out.length!==1)return{ok:false,msg:'Expected exactly 1 line, got '+out.length+'.'};
          if(out[0]!=='Express has 6 carriages')return{ok:false,msg:'Got "'+out[0]+'" but expected "Express has 6 carriages". Check both property values and the dot notation reading them back.'};
          return{ok:true,msg:'An object with two labelled properties, both read back with dot notation — that is the whole idea.'};
        }
      },
      {
        id:'z5-a-list-of-objects', kind:'learn', title:'A list of objects',
        brief:'<p>An array can hold objects just as easily as numbers or strings. <code>delays[0]</code> still picks the item by position — that part has not changed. What is new is that the item itself now has labels.</p>',
        code:'const delays = [\n  { route: "A12", minutes: 2 },\n  { route: "B7", minutes: 14 }\n];\n\nconsole.log(delays[0].route);\nconsole.log(delays[1].minutes);\n\n// A12\n// 14',
        codeNote:'delays[0] gets the first OBJECT — square brackets choose position, same as any array. .route then reads a label off THAT object — dot notation, same as always. Two steps: brackets pick the item, a dot reads its label.',
        reinforces:['arrays','index']
      },
      {
        id:'z5-two-steps-pick-then-read', kind:'mcq', title:'Two steps: pick, then read',
        brief:'<p>Work this one out in two separate steps rather than all at once.</p>',
        code:'const trips = [\n  { rider: "Sam", fare: 5 },\n  { rider: "Alex", fare: 8 }\n];\n\nconsole.log(trips[1].rider);',
        question:'What lands on the board?',
        options:['Alex','Sam','rider','trips[1].rider'],
        answer:0,
        explain:'trips[1] picks the second object in the array — position 1, since positions start at 0 — which is { rider: "Alex", fare: 8 }. .rider then reads the rider label off that object: "Alex". Two steps in one line: index to pick, dot to read.',
